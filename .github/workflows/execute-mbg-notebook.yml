name: Execute MBG Portfolio Notebook

on:
  push:
    paths:
      - "sentiment_analysis_mbg_youtube.ipynb"
      - "data/mbg_comments_labeled.csv"
      - "Scripts/05_restore_labeled_metadata.py"
      - "data/coordination_analysis/coordination_pattern_review_candidates.csv"
      - "data/coordination_analysis/coordination_multi_signal_candidates_anonymized.csv"
      - "data/coordination_analysis/coordination_screening_summary.json"
      - ".github/workflows/execute-mbg-notebook.yml"
  workflow_dispatch:

concurrency:
  group: mbg-portfolio-notebook
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  execute-notebook:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUN_OPTUNA: "1"
      OPTUNA_TRIALS: "5"
      TF_CPP_MIN_LOG_LEVEL: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Restore labeled dataset metadata
        run: |
          python Scripts/05_restore_labeled_metadata.py

      - name: Execute notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --ExecutePreprocessor.timeout=1800 \
            --ExecutePreprocessor.kernel_name=python3 \
            --output sentiment_analysis_mbg_youtube_executed.ipynb \
            sentiment_analysis_mbg_youtube.ipynb

      - name: Replace portfolio notebook with executed version
        run: |
          mv sentiment_analysis_mbg_youtube_executed.ipynb sentiment_analysis_mbg_youtube.ipynb

      - name: Commit executed notebook, restored dataset, and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mbg_comments_labeled.csv sentiment_analysis_mbg_youtube.ipynb results/ best_baseline_bilstm.keras best_model.keras
          if git diff --cached --quiet; then
            echo "No notebook/result/data changes to commit."
          else
            git commit -m "Execute final MBG portfolio notebook"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
